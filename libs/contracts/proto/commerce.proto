syntax = "proto3";

package commerce;

service OrderService {
  rpc GetOrder (GetOrderRequest) returns (GetOrderResponse);
  rpc ListCustomerOrders (ListCustomerOrdersRequest) returns (ListCustomerOrdersResponse);
  rpc CreateOrder (CreateOrderRequest) returns (CreateOrderResponse);
  rpc TransitionOrderStatus (TransitionOrderStatusRequest) returns (Order);
}

message GetOrderRequest {
  string order_id = 123;
}

message GetOrderResponse {
  Order order = 1;
}

message ListCustomerOrdersRequest {
  string customer_id = 1;
  string status = 2;
  int32 page_size = 3;
  string cursor = 4;
}

message OrderSummary {
  string order_id = 1;
  string status = 2;
  int64 total_amount_minor = 3;
  string currency = 4;
  string created_at = 5;
}

message ListCustomerOrdersResponse {
  repeated OrderSummary orders = 1;
  string next_cursor = 2;
}

message CreateOrderRequest {
  string customer_id = 1;
  string idempotency_key = 2;
  string currency = 3;
  repeated CreateOrderItem items = 4;
}

message CreateOrderItem {
  string product_id = 1;
  string product_name = 2;
  int32 quantity = 3;
  int64 unit_price_minor = 4;
}

message CreateOrderResponse {
  Order order = 1;
  bool replayed = 2;
}

message TransitionOrderStatusRequest {
  string order_id = 1;
  string expected_status = 2;
  string next_status = 3;
}

message Order {
  string order_id = 1;
  string customer_id = 2;
  string status = 3;
  int64 total_amount_minor = 4;
  string currency = 5;
  string idempotency_key = 6;
  repeated OrderItem items = 7;
}

message OrderItem {
  string id = 1;
  string product_id = 2;
  string product_name = 3;
  int32 quantity = 4;
  int64 unit_price_minor = 5;
  int64 line_total_minor = 6;
}
