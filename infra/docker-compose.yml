services:
  redis:
    image: redis:7.4-alpine
    container_name: commerce-redis
    command: redis-server --appendonly no --maxmemory 256mb --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    container_name: commerce-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: commerce-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://127.0.0.1:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

  postgres:
    image: postgres:17
    container_name: commerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: commerce_orders
      POSTGRES_USER: commerce_app
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U commerce_app -d commerce_orders
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-test:
    image: postgres:17
    container_name: commerce-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_DB: commerce_orders_test
      POSTGRES_USER: commerce_app
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5434:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U commerce_app -d commerce_orders_test
      interval: 5s
      timeout: 3s
      retries: 10

  inventory-postgres:
    image: postgres:17
    environment: { POSTGRES_DB: commerce_inventory, POSTGRES_USER: commerce_app, POSTGRES_PASSWORD: local_dev_password }
    ports: ["5435:5432"]
    volumes: [inventory_data:/var/lib/postgresql/data]

  payment-postgres:
    image: postgres:17
    environment: { POSTGRES_DB: commerce_payments, POSTGRES_USER: commerce_app, POSTGRES_PASSWORD: local_dev_password }
    ports: ["5436:5432"]
    volumes: [payment_data:/var/lib/postgresql/data]

  fulfillment-postgres:
    image: postgres:17
    environment: { POSTGRES_DB: commerce_fulfillment, POSTGRES_USER: commerce_app, POSTGRES_PASSWORD: local_dev_password }
    ports: ["5437:5432"]
    volumes: [fulfillment_data:/var/lib/postgresql/data]

  notification-postgres:
    image: postgres:17
    environment: { POSTGRES_DB: commerce_notifications, POSTGRES_USER: commerce_app, POSTGRES_PASSWORD: local_dev_password }
    ports: ["5438:5432"]
    volumes: [notification_data:/var/lib/postgresql/data]

volumes:
  postgres_data:
  postgres_test_data:
  inventory_data:
  payment_data:
  fulfillment_data:
  notification_data:
